name = "flashnx"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
GITHUB_REPO = "Jonathan8520/FlashNX"
# GITHUB_TOKEN is a secret, not a plain var:
#   wrangler secret put GITHUB_TOKEN

# Community-profile "most applied" counter (#20, Phase 3). KV namespace created
# with `wrangler kv namespace create PROFILES_KV`; backs /applied and /counts.
# (The app degrades gracefully if this binding is ever removed.)
[[kv_namespaces]]
binding = "PROFILES_KV"
id = "7e2c8186f131443595b13be6c22f5aa9"
