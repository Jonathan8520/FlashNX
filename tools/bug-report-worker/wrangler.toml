name = "flashnx-bug-report"
main = "worker.js"
compatibility_date = "2024-11-01"

[vars]
GITHUB_REPO = "Jonathan8520/FlashNX"
# GITHUB_TOKEN is a secret, not a plain var:
#   wrangler secret put GITHUB_TOKEN

# Community-profile "most applied" counter (#20, Phase 3). Create the namespace
# once and paste its id below, then redeploy:
#   wrangler kv namespace create PROFILES_KV
# Without this binding, /applied and /counts no-op gracefully (the picker just
# falls back to verified + completeness ordering).
[[kv_namespaces]]
binding = "PROFILES_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
