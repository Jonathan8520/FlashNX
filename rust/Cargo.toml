[package]
name = "ruffle_switch"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "ruffle_switch"
crate-type = ["staticlib"]

[dependencies]
# Phase 1 will add:
# ruffle_core    = { path = "../third_party/ruffle/core" }
# ruffle_render  = { path = "../third_party/ruffle/render" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "abort"
