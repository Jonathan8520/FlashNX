[package]
name = "ruffle_switch"
version = "1.3.0"
edition = "2021"
publish = false

[lib]
name = "ruffle_switch"
crate-type = ["staticlib"]

[dependencies]
# Pulled in at Phase 1.2 (2026-05-21). Default features off — we don't need
# lzma, aac, egui, jpegxr. `audio` feature enables Ruffle's software AudioMixer
# (dasp + PCM/ADPCM decoders) which we wire to libnx audren in
# [backend::audio::SwitchAudioBackend] (Phase 2.2).
# `mp3` for streamed music; `nellymoser` for voice clips — Super Smash Flash
# encodes its announcer + most SFX as Nellymoser (284 sounds, issue #29). With
# the decoder missing, those plays returned no SoundInstance, so onSoundComplete
# never fired: the "Complete!" announcer that gates the stage-clear transition
# never finished, freezing the game on a blank COMPLETE screen. nellymoser-rs is
# a pure-Rust DSP decoder (no threads/rayon), safe on Switch. AAC stays off.
ruffle_core = { path = "../third_party/ruffle/core", default-features = false, features = ["audio", "mp3", "nellymoser", "default_font"] }
# Phase 1.3 (2026-05-23): RenderBackend trait lives here. Already pulled
# transitively by ruffle_core with feature `tessellator`, but we need a direct
# dep to name its types in src/backend/render.rs.
ruffle_render = { path = "../third_party/ruffle/render", features = ["tessellator"] }
# Same — swf::Color is the clear color in submit_frame.
swf = { path = "../third_party/ruffle/swf" }
# Phase 3.x — library AS3 badge. We decompress only the small prefix of each
# SWF body at scan time to read its FileAttributes tag (AVM2/ActionScript3
# flag), so the library can warn that an AS3 game has limited support. flate2
# is already in the dep tree (the `swf` crate uses it for CWS), so direct-dep
# binary cost is ~0.
flate2 = "1"
# Needed to declare `__getrandom_v03_custom` with the correct Error type;
# the cfg flag in .cargo/config.toml puts getrandom in "custom backend" mode.
getrandom = "0.3"
# Wire a tracing subscriber so Ruffle's internal warn!/error!/debug! reach
# nxlink. Without this they go to a noop subscriber and we miss signal —
# notably the frame-40 mystery crash whose precursor is likely a tracing
# warn or error from Ruffle itself.
tracing = "0.1.43"
# Phase 3.3 (suite) — user-editable keymap JSON on SD card. serde_json is
# already in Ruffle's transitive dep tree (used by SharedObject de/serialise
# etc.), so this is binary-size-free; we just declare it as a direct dep so
# we can name its types in src/keymap.rs.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phase 3.4 — banner.png decode (assets/banner.png embedded via include_bytes!
# and uploaded as a GL texture for the library UI title). `png` 0.18.x is
# already pulled transitively by ruffle_render and `image`, so direct-dep
# binary cost is ~0. Picked over the full `image` crate to keep the API
# surface tight (we only need PNG, not BMP/TIFF/AVIF/WebP).
png = "0.18"
# v1.2.0 — local cover art. We decode user-dropped `.jpg` sidecars and (opt-in)
# Flashpoint logos. jpeg-decoder is pinned via [patch.crates-io] to the Switch
# fork. CRITICAL: `default-features = false` — the crate defaults to `rayon`,
# whose parallel decode path (`compute_image_parallel`) spawns threads and
# CRASHES on Switch (newlib pthread). ruffle_render already disables it for the
# same reason; enabling it here (even just by feature-unification from a default
# dep) re-introduced the crash on any SWF with an embedded JPEG. We only use the
# single-threaded API (Decoder::new/decode/info), so no features are needed.
jpeg-decoder = { version = "0.3", default-features = false }
# v1.2.x — multi-file SWF games. The sidecar NavigatorBackend in
# src/backend/navigator.rs serves a game's sibling SWFs off the SD card so
# loadMovie / GetURL-into-_levelN works (e.g. Garfield's Scary Scavenger Hunt
# loads top.swf into _level100, which sets _level0.introend=2 to unblock its
# frame-4 gate). These four are only needed to *name* the types in our
# `impl NavigatorBackend` (url/encoding_rs in the fetch response; async-channel/
# indexmap in the socket + navigate signatures). Versions pinned to Ruffle's
# workspace so they unify to a single crate instance — a second copy would make
# our impl reference foreign Url/Encoding types and fail to satisfy the trait.
url = "2.5.8"
encoding_rs = "0.8.35"
async-channel = "2.5.0"
indexmap = "2.13.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

# Fast-iteration release profile. Same opt-level as release so runtime
# behaviour is the same modulo LLVM LTO bugs, but `lto = "thin"` and
# `codegen-units = 16` cut the compile + link time from ~3 min to ~30 s.
# Use for hardware test iterations (`cargo build --profile release-dev`).
# The official `.nro` we ship still goes through `--release`.
[profile.release-dev]
inherits = "release"
lto = "thin"
codegen-units = 16
# Keep symbols so panics resolve to source lines in dev sessions.
strip = "none"

[profile.dev]
panic = "abort"

# Switchfork of jpeg-decoder 0.3.2 with select_worker() patched to never
# pick the multithreaded path. The default heuristic spawns std::thread
# for JPEGs > 128*128 px, which crashes natively on Switch (newlib pthread
# limitation). Pinned in third_party/. Pin once we confirm fixed, then can
# upstream a target-cfg PR.
[patch.crates-io]
jpeg-decoder = { path = "../third_party/jpeg-decoder-switchfork" }
