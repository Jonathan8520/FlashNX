[package]
name = "ruffle_switch"
version = "0.0.1"
edition = "2021"
publish = false

[lib]
name = "ruffle_switch"
crate-type = ["staticlib"]

[dependencies]
# Pulled in at Phase 1.2 (2026-05-21). Default features off — we don't need
# lzma, mp3, aac, nellymoser, audio (dasp), egui, jpegxr. We'll add
# ruffle_render once core compiles, since RenderBackend lives there.
ruffle_core = { path = "../third_party/ruffle/core", default-features = false }
# Needed to declare `__getrandom_v03_custom` with the correct Error type;
# the cfg flag in .cargo/config.toml puts getrandom in "custom backend" mode.
getrandom = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
panic = "abort"
