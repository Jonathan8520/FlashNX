# Phase 1.1 attempt: build std for the existing tier-3 Switch target.
#
# The upstream `aarch64-nintendo-switch-freestanding` spec is missing 3 fields
# the 3DS target has, which stdlib's cfg_select! gates check:
#   - target-family = ["unix"]
#   - env = "newlib"
#   - has-thread-local = true
#
# Instead of forking the spec into a JSON (which now requires a flag rustc
# doesn't yet recognize on this nightly), we override the cfg gates directly
# via rustflags. This applies to stdlib too because of -Z build-std.
[build]
target = "aarch64-nintendo-switch-freestanding"
rustflags = [
    "--cfg", "target_family=\"unix\"",
    "--cfg", "target_env=\"newlib\"",
    # `cfg(unix)` is a well-known shortcut that's normally auto-derived from
    # the target spec's family field; --cfg target_family doesn't propagate
    # to it. libc and stdlib both use `cfg(unix)` directly, so we must set
    # both forms.
    "--cfg", "unix",
    # Recent nightlies deny manually setting "built-in" cfgs via --cfg.
    # We're intentionally overriding these because the upstream target spec
    # is missing fields it should have for std support, so bypass the lint.
    "-A", "explicit_builtin_cfgs_in_flags",
    "-Z", "has-thread-local=true",
]

[unstable]
build-std = ["std", "panic_abort", "core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
