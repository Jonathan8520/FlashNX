# Phase 0: no_std staticlib targeting the Rust tier-3 Switch target.
# Tier-3 means rust-std isn't pre-built, so we build core/alloc from source
# via `-Z build-std`. This requires the nightly toolchain (pinned via
# rust-toolchain.toml).
#
# Phase 1 will switch to a custom JSON target that maps libc -> newlib so we
# can pull in ruffle_core (which needs std). The freestanding target only
# supports no_std code.
[build]
target = "aarch64-nintendo-switch-freestanding"

[unstable]
build-std = ["core", "alloc", "compiler_builtins"]
build-std-features = ["compiler-builtins-mem"]
